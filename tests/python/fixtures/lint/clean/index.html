<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor - invoicing for small studios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="hero">
    <h1>Send invoices your clients actually open</h1>
    <p>Harbor turns a finished project into a paid invoice in two clicks.</p>
    <button class="btn" type="button">Start free trial &rarr;</button>
    <img src="dashboard.webp" alt="Harbor dashboard showing three paid invoices" width="1200" height="800">
    <img src="divider.svg" alt="">
  </section>
  <ul>
    <li>Recurring invoices</li>
    <li>Stripe and bank transfer</li>
  </ul>
  <script>
    window.addEventListener('scroll', onScroll, { passive: true });
    const opts = { passive: true };
    document.addEventListener('touchmove', onTouch, opts);
    function onScroll() {}
    function onTouch() {}
  </script>
</body>
</html>
